[build]
  command = "npm run build"
  publish = ".next"
  # Node 20: Node 18 is end-of-life.
  environment = { NODE_VERSION = "20", NPM_FLAGS = "--legacy-peer-deps" }

# Netlify's Next.js runtime (OpenNext). Normally auto-installed, but deploys showed
# "No functions deployed" (it never ran, so .next was served as static files: 404).
# Declared explicitly and deliberately unpinned: Netlify keeps it current.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Frontend build settings only. Backend settings (SECRET_KEY, SMTP, DATABASE_URL) belong to
# the API host, never here. Set NEXT_PUBLIC_API_BASE_URL in the Netlify UI to the public API
# origin (no trailing slash, no /api) once the backend is deployed; it is baked in at build time.

[[headers]]
  # The service worker (Serwist) is served at /sw.js; it must never be cached or users get stuck on old builds.
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
