# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Render: New -> Blueprint -> pick this repo. It asks for the values marked `sync: false`.
# The database is Neon's free Postgres (Render's free Postgres is deleted after 30 days).
services:
  - type: web
    name: cosmicdharma-api
    runtime: python
    plan: free              # sleeps after 15 min idle; .github/workflows/keep-alive.yml pings it
    region: singapore       # match the Neon region (AWS ap-southeast-1) to keep DB round trips short
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: chart jobs and the chart cache live in this process's memory.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy main only after the GitHub checks pass
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # 256-bit random; changing it logs everyone out
      - key: DATABASE_URL
        sync: false                  # paste Neon's connection string (postgresql://...sslmode=require)
      - key: CORS_ORIGINS
        value: https://cosmicdharma.app,https://www.cosmicdharma.app
      - key: FRONTEND_URL
        value: https://cosmicdharma.app
      - key: NOMINATIM_USER_AGENT
        value: CosmicDharma/2.1 (+https://cosmicdharma.app)
