name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npm run test:frontend
      # Same build Netlify runs; it fails on any type error or bad import.
      - run: npm run build

  # Same build Netlify runs (Linux, Node 20, Next.js runtime plugin), so deploy failures show
  # up here with a readable log instead of only in the Netlify dashboard.
  netlify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npx -y netlify-cli@latest build --offline --context deploy-preview
        env:
          NETLIFY_TELEMETRY_DISABLED: '1'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      # pytest.ini puts backend/ on sys.path, so tests import `app.*` like the server does.
      - run: pytest
