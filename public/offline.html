<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080f">
  <title>You’re offline · Cosmic Dharma</title>
  <style>

      color: #eeebe3; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    main { max-width: 26rem; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 2.2rem; margin: 1.5rem 0 .5rem; }
    p { color: #a6aaba; line-height: 1.6; margin: 0; }
    button {
      margin-top: 2rem; border: 0; border-radius: 999px; padding: .85rem 1.6rem; font: 600 1rem/1 inherit;
      background: #e0b76a; color: #181106; cursor: pointer;
    }

</head>

</html>
